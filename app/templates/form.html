{% extends 'base.html' %}

{% block title %}{{ title }} - Gestão Financeira{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card border-0 shadow-sm p-4">
      <h4 class="mb-4">{{ title }}</h4>

      <form method="POST">
        <div class="row g-3">
          <div class="col-md-6">
            <label for="type" class="form-label">Tipo</label>
            <select class="form-select" id="type" name="type" required>
              <option value="DESPESA">Despesa</option>
              <option value="RECEITA">Receita</option>
            </select>
          </div>

          <div class="col-md-6">
            <label for="amount" class="form-label">Valor (R$)</label>
            <input type="number" step="0.01" class="form-control" id="amount" name="amount" required placeholder="0.00">
          </div>

          <div class="col-12">
            <label for="description" class="form-label">Descrição</label>
            <input type="text" class="form-control" id="description" name="description" required>
          </div>

          <div class="col-md-6">
            <label for="date" class="form-label">Data</label>
            <input type="date" class="form-control" id="date" name="date" required>
          </div>

          <div class="col-md-6">
            <label for="account_id" class="form-label">Conta</label>
            <select class="form-select" id="account_id" name="account_id">
              <option value="">Selecione...</option>
              {% for account in accounts %}
                <option value="{{ account.id }}">{{ account.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4">
          <a href="{{ url_for('transactions.list_transactions') }}" class="btn btn-light">Cancelar</a>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
