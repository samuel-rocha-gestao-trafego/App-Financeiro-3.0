{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white dark:bg-slate-800 p-6 sm:p-8 rounded-2xl border border-slate-100 dark:border-slate-700 shadow-sm space-y-6">
    <div>
        <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Novo Lançamento</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400">Registre receitas ou despesas</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="p-4 text-sm rounded-lg {% if category == 'danger' %}bg-rose-50 text-rose-800 dark:bg-rose-900/30 dark:text-rose-400{% else %}bg-emerald-50 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-400{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('transactions.novo_lancamento') }}" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium mb-1">Tipo</label>
                <select name="tipo" required class="w-full p-2.5 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 text-sm">
                    <option value="Despesa">Despesa (Saída)</option>
                    <option value="Receita">Receita (Entrada)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Forma de Pagamento</label>
                <select id="forma_pagamento" name="forma_pagamento" class="w-full p-2.5 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 text-sm" onchange="toggleCartaoSelect()">
                    <option value="Pix / Dinheiro">Pix / Dinheiro</option>
                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                    <option value="Débito">Débito</option>
                    <option value="Boleto">Boleto</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>
        </div>

        <!-- Seleção de Cartão (Aparece se for Cartão de Crédito) -->
        <div id="campo_cartao" class="hidden">
            <label class="block text-sm font-medium mb-1">Selecione o Cartão</label>
            <select name="cartao_id" class="w-full p-2.5 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 text-sm">
                {% for cartao in cartoes %}
                    <option value="{{ cartao.id }}">{{ cartao.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Descrição</label>
            <input type="text" name="descricao" required placeholder="Ex: Mercado, Salário, Compra online" class="w-full p-2.5 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 text-sm">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium mb-1">Valor Total (R$)</label>
                <input type="number" step="0.01" name="valor" required placeholder="0.00" class="w-full p-2.5 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Data da 1ª Parcela</label>
                <input type="date" name="data" required title="Data em que ocorreu a primeira parcela da compra" class="w-full p-2.5 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 text-sm">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium mb-1">Categoria</label>
                <input type="text" name="categoria" placeholder="Ex: Alimentação, Vestuário" class="w-full p-2.5 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 text-sm">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-sm font-medium mb-1">Parcelas</label>
                    <input type="number" name="parcelas" min="1" value="1" class="w-full p-2.5 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Início</label>
                    <input type="number" name="parcela_inicial" min="1" value="1" title="Útil para compras já em andamento (ex: começar da 8 de 10)" class="w-full p-2.5 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 text-sm">
                </div>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Conta Vinculada</label>
            <select name="conta_id" class="w-full p-2.5 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 text-sm">
                <option value="">Nenhuma / Não especificada</option>
                {% for conta in contas %}
                    <option value="{{ conta.id }}">{{ conta.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="flex items-center space-x-2 pt-2">
            <input type="checkbox" id="pago" name="pago" class="rounded text-indigo-600 focus:ring-indigo-500">
            <label for="pago" class="text-sm font-medium text-slate-700 dark:text-slate-300">Já está Pago/Confirmado</label>
        </div>

        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl transition-colors text-sm">
            Salvar Lançamento
        </button>
    </form>
</div>

<script>
function toggleCartaoSelect() {
    var forma = document.getElementById('forma_pagamento').value;
    var campo = document.getElementById('campo_cartao');
    if (forma === 'Cartão de Crédito') {
        campo.classList.remove('hidden');
    } else {
        campo.classList.add('hidden');
    }
}
</script>
{% endblock %}
